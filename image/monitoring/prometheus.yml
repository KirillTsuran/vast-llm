global:
  scrape_interval: 5s
scrape_configs:
  - job_name: tabby
    # the model server answers /metrics between generation steps; a long prompt chunk can delay it by several seconds
    scrape_interval: 10s
    scrape_timeout: 9s
    metrics_path: /metrics
    static_configs: [{targets: ['127.0.0.1:8080']}]
  - job_name: gpu
    static_configs: [{targets: ['127.0.0.1:9101']}]
  - job_name: node
    static_configs: [{targets: ['127.0.0.1:9100']}]
  - job_name: loki
    static_configs: [{targets: ['127.0.0.1:3100']}]
  - job_name: alloy
    static_configs: [{targets: ['127.0.0.1:12345']}]
  - job_name: prometheus
    static_configs: [{targets: ['127.0.0.1:9090']}]
  - job_name: grafana
    static_configs: [{targets: ['127.0.0.1:3000']}]
