apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData: {timeInterval: 10s}   # slowest scrape (llmd); sets the minimum $__rate_interval
  - name: Loki
    uid: loki
    type: loki
    url: http://127.0.0.1:3100
    jsonData: {maxLines: 2000}
