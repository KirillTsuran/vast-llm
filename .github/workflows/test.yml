name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - shell: bash
        run: GOOS=linux go vet ./cmd/llmd
