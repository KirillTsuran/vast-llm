name: image
on:
  push:
    branches: [main]
    paths: ['image/**', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (torch+CUDA layer is ~7 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: ghcr.io/kirilltsuran/vast-llm:latest,ghcr.io/kirilltsuran/vast-llm:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/KirillTsuran/vast-llm
