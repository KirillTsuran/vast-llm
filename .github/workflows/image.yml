name: image
on:
  push:
    branches: [main]
    paths: ['image/**', 'cmd/llmd/**', 'go.mod', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the CUDA devel base is ~10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          push: true
          # every run pushes its commit tag; main also pushes :3, the tag VastLLM rents          tags: |
            ghcr.io/kirilltsuran/vast-llm:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/kirilltsuran/vast-llm:3' || '' }}
          labels: org.opencontainers.image.source=https://github.com/KirillTsuran/vast-llm
          cache-from: type=gha
          cache-to: type=gha,mode=max
