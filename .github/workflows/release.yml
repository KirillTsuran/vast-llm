name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - shell: bash
        run: go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=${GITHUB_REF_NAME#v}" -o VastLLM.exe ./cmd/vastllm
      - uses: softprops/action-gh-release@v2
        with:
          files: VastLLM.exe
          generate_release_notes: true
